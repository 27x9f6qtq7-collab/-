{% extends "base.html" %}
{% block content %}
<h2>协议管理</h2>
<ul class="nav nav-tabs mb-3" id="agreementTab" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#privacy">隐私政策</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#terms">服务条款</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#disclaimer">免责声明</button></li>
</ul>
<div class="tab-content">
    <div class="tab-pane fade show active" id="privacy">
        <form method="POST" action="{{ url_for('admin.agreements') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="type" value="privacy">
            <div class="mb-3"><textarea name="content" class="form-control" rows="20">{{ privacy }}</textarea></div>
            <button type="submit" class="btn btn-primary">保存隐私政策</button>
        </form>
    </div>
    <div class="tab-pane fade" id="terms">
        <form method="POST" action="{{ url_for('admin.agreements') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="type" value="terms">
            <div class="mb-3"><textarea name="content" class="form-control" rows="20">{{ terms }}</textarea></div>
            <button type="submit" class="btn btn-primary">保存服务条款</button>
        </form>
    </div>
    <div class="tab-pane fade" id="disclaimer">
        <form method="POST" action="{{ url_for('admin.agreements') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="type" value="disclaimer">
            <div class="mb-3"><textarea name="content" class="form-control" rows="20">{{ disclaimer }}</textarea></div>
            <button type="submit" class="btn btn-primary">保存免责声明</button>
        </form>
    </div>
</div>
{% endblock %}
