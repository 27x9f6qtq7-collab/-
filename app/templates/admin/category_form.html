{% extends "base.html" %}
{% block content %}
<h2>{{ '编辑分类' if category else '新增分类' }}</h2>
<form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label class="form-label">父级分类</label>
        <select name="parent_id" class="form-select">
            <option value="">-- 无（作为一级分类） --</option>
            {% for cat in categories %}
                {% if not cat.parent_id or cat.level() < 3 %}
                <option value="{{ cat.id }}" 
                    {% if category and category.parent_id == cat.id %}selected{% endif %}
                    {% if exclude_ids and cat.id in exclude_ids %}disabled{% endif %}>
                    {{ '|---' * cat.level() }}{{ cat.name }}
                </option>
                {% endif %}
            {% endfor %}
        </select>
    </div>
    <div class="mb-3"><label>分类名称</label><input type="text" name="name" class="form-control" value="{{ category.name if category else '' }}" required></div>
    <div class="mb-3"><label>排序值（数字越小越靠前）</label><input type="number" name="sort_order" class="form-control" value="{{ category.sort_order if category else 0 }}"></div>
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="{{ url_for('admin.categories') }}" class="btn btn-secondary">返回</a>
</form>
{% endblock %}
