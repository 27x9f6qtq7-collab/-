{% extends "base.html" %}
{% block content %}
<h2>发送私信</h2>
<form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label>收件人学号</label>
        <input type="text" name="receiver_student_id" class="form-control" placeholder="请输入对方学号" required>
        <small class="text-muted">请输入收件人的学号</small>
    </div>
    <div class="mb-3">
        <label>内容</label>
        <textarea name="content" class="form-control" rows="5" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">发送</button>
    <a href="{{ url_for('main.messages') }}" class="btn btn-secondary">取消</a>
</form>
{% endblock %}
