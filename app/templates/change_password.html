{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-3">修改密码</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3"><label>原密码</label><input type="password" name="old_password" class="form-control" required></div>
            <div class="mb-3"><label>新密码（至少6位）</label><input type="password" name="new_password" class="form-control" required></div>
            <div class="mb-3"><label>确认新密码</label><input type="password" name="confirm_password" class="form-control" required></div>
            <button type="submit" class="btn btn-primary w-100">确认修改</button>
        </form>
        <div class="mt-3 text-center"><a href="{{ url_for('main.index') }}">返回首页</a></div>
    </div>
</div>
{% endblock %}
