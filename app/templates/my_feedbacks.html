{% extends "base.html" %}
{% block content %}
<h2>我的反馈</h2>
<a href="{{ url_for('main.submit_feedback') }}" class="btn btn-primary mb-3">提交新反馈</a>
<table class="table table-striped">
    <thead><tr><th>标题</th><th>内容</th><th>状态</th><th>回复</th><th>时间</th></thead>
    <tbody>
        {% for fb in feedbacks %}
        <tr>
            <td>{{ fb.title }}</div>
            <td>{{ fb.content }}</div>
            <td>{{ fb.status }}</div>
            <td>{{ fb.reply or '未回复' }}</div>
            <td>{{ fb.created_at.strftime('%Y-%m-%d %H:%M') }}</div>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
