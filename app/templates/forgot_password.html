{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-warning text-white"><h4>忘记密码</h4></div>
            <div class="card-body text-center">
                <p>如果您忘记了密码，请联系管理员重置。</p>
                <p>管理员联系方式：<strong>{{ admin_contact }}</strong></p>
                <a href="{{ url_for('auth.login') }}" class="btn btn-primary">返回登录</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
