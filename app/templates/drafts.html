{% extends "base.html" %}
{% block content %}
<h2>我的草稿</h2>
<a href="{{ url_for('main.draft_create') }}" class="btn btn-success mb-3">新建草稿</a>
<table class="table table-striped">
    <thead><tr><th>标题</th><th>价格</th><th>更新时间</th><th>操作</th></thead>
    <tbody>
        {% for draft in drafts %}
        <tr>
            <td>{{ draft.title }}</div>
            <td>¥{{ draft.price }}</div>
            <td>{{ draft.updated_at.strftime('%Y-%m-%d %H:%M') }}</div>
            <td>
                <a href="{{ url_for('main.draft_edit', draft_id=draft.id) }}" class="btn btn-sm btn-primary">编辑</a>
                <a href="{{ url_for('main.draft_publish', draft_id=draft.id) }}" class="btn btn-sm btn-success">发布</a>
                <a href="{{ url_for('main.draft_delete', draft_id=draft.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除草稿？')">删除</a>
              </div>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
