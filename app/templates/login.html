{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-3">学号登录</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3"><input type="text" name="student_id" class="form-control" placeholder="学号" required></div>
            <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="密码" required></div>
            <button type="submit" class="btn btn-primary w-100">登录</button>
        </form>
        <div class="mt-3 text-center">
            <a href="{{ url_for('auth.register') }}">没有账号？立即注册</a>
        </div>
        <div class="mt-2 text-center">
            <a href="{{ url_for('auth.forgot_password') }}">忘记密码？</a>
        </div>
    </div>
</div>
{% endblock %}
